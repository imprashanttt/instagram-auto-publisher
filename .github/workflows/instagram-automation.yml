name: Instagram automation

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Choose one task"
        required: true
        default: "check"
        type: choice
        options:
          - check
          - publish
          - insights
          - comments

permissions:
  contents: write

concurrency:
  group: instagram-automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run selected task
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_VERSION: v26.0
        run: python instagram_automation.py "${{ inputs.task }}"

      - name: Commit queue status after successful publish
        if: ${{ inputs.task == 'publish' }}
        run: |
          if git diff --quiet -- queue/posts.json; then
            echo "Queue did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue/posts.json
          git commit -m "Mark Instagram queue item as published"
          git push
